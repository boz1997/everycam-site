<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>ShareCam</title>
  <script>
    // ESKİ FUNNEL SAYFASI — artık yalnız yönlendirir.
    //
    // Katılım deneyimi /join/ altındaki web istemcisine taşındı (isim, yükleme,
    // galeri). Bu dosya duruyor çünkü daha önce üretilmiş linkler ve tarayıcı
    // geçmişleri buraya gelebilir; kodu koruyarak devrediyor.
    (function () {
      var code = (new URLSearchParams(location.search).get('code') || '')
        .toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
      location.replace('join/' + (code ? '?code=' + encodeURIComponent(code) : ''));
    })();
  </script>
</head>
<body>
  Redirecting… <a href="join/">ShareCam</a>
</body>
</html>
