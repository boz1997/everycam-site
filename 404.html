<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>ShareCam</title>
  <script>
    // GitHub Pages'te dinamik yol yok — QR linkleri /e/KOD biçiminde gelir ve
    // 404'e düşer; kod buradan çıkarılıp misafir uygulamasına yönlendirilir.
    //
    // Hedef artık /join/ (Vite ile üretilen web istemcisi). Eski e.html de
    // duruyor ve oraya yönlendiriyor: bugüne kadar basılmış hiçbir QR kırılmasın.
    //
    // Taban yol pathname'den hesaplanır çünkü proje sitesi alt yolda yaşıyor
    // (/everycam-site/...); özel alan adına geçince kök '/' olur ve aynı kod çalışır.
    (function () {
      var m = location.pathname.match(/^(.*)\/e\/([A-Za-z0-9]{4,8})\/?$/);
      if (m) {
        location.replace(m[1] + '/join/?code=' + encodeURIComponent(m[2].toUpperCase()) + location.hash);
        return;
      }
      // Fotoğrafçının masaüstü yükleyicisi: kısa adres sharecam.app/upload
      // (uygulamada böyle söyleniyor) → /join/upload/ (Vite ikinci sayfa).
      var u = location.pathname.match(/^(.*)\/upload\/?$/);
      if (u) {
        location.replace(u[1] + '/join/upload/' + location.search + location.hash);
        return;
      }
      // Çiftin albüm sayfası: sharecam.app/album → /join/album/
      var a = location.pathname.match(/^(.*)\/album\/?$/);
      if (a) {
        location.replace(a[1] + '/join/album/' + location.search + location.hash);
        return;
      }
      // Etkinlik sahibinin web paneli: sharecam.app/host → /join/host/ (Vite dördüncü sayfa,
      // plan D1). /host/ normalde host/index.html'e düşer; bu kural eğik çizgisiz ya da o
      // dosyanın olmadığı durum için. ?_ptxn= (Paddle ödeme linki) ve #/… rotası aynen taşınır.
      // /join/host kendisi 404 verirse (panel henüz derlenmemiş) /join/join/host/'a gitmesin.
      var h = location.pathname.match(/^(.*)\/host\/?$/);
      if (h && !/\/join$/.test(h[1])) {
        location.replace(h[1] + '/join/host/' + location.search + location.hash);
        return;
      }
      var parts = location.pathname.split('/').filter(Boolean);
      var base = /\.github\.io$/.test(location.hostname) && parts.length > 0 ? '/' + parts[0] + '/' : '/';
      location.replace(base);
    })();
  </script>
</head>
<body>
  Redirecting… <a href="index.html">ShareCam</a>
</body>
</html>
